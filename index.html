<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Excavadora IoT</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Panel de LEDs en la esquina superior derecha -->
    <div class="led-panel position-absolute top-0 end-0 p-3 text-end">
        <div class="d-flex align-items-center justify-content-end mb-2" title="WebSocket WSS">
            <span class="text-white me-2 small fw-bold text-shadow">WSS</span>
            <div id="led-ws" class="led led-gray"></div>
        </div>
        <div class="d-flex align-items-center justify-content-end mb-2" title="API AWS (21 Servicios)">
            <span class="text-white me-2 small fw-bold text-shadow">API AWS</span>
            <div id="led-api" class="led led-yellow"></div>
        </div>
        <div class="d-flex align-items-center justify-content-end" title="Amazon RDS">
            <span class="text-white me-2 small fw-bold text-shadow">Amazon RDS</span>
            <div id="led-rds" class="led led-gray"></div>
        </div>
    </div>

    <main class="container my-5 pt-4">
        <div class="remote-body">
            <div class="top-plate text-center mb-4">TRUCK CONTROL</div>
            
            <div class="row align-items-center">
                <!-- Joystick Izquierdo (Orugas) -->
                <div class="col-md-4 text-center">
                    <h5 class="text-white">ORUGAS</h5>
                    <div class="d-pad-ring mx-auto" id="joyLeftWrap">
                        <div class="d-pad-hole"></div>
                        <div class="joy-stick" id="joyLeft"></div>
                    </div>
                </div>

                <!-- Panel Central -->
                <div class="col-md-4 text-center center-panel">
                    <button id="btn-7" class="btn btn-warning w-100 mb-2 font-monospace fw-bold">💡 LUCES (7)</button>
                    <button id="btn-5" class="btn btn-warning w-100 mb-2 font-monospace fw-bold">🔊 SONIDO (5)</button>
                    <button id="btn-8" class="btn btn-warning w-100 mb-4 font-monospace fw-bold">⚙️ AUX (8)</button>

                    <!-- Selector de Demos (Solo lectura) -->
                    <div class="demo-section p-3 bg-dark rounded border border-secondary mb-3">
                        <h6 class="text-warning">Catálogo de DEMOS</h6>
                        <select id="demoSelect" class="form-select mb-2 font-monospace">
                            <option value="">Cargando demos...</option>
                        </select>
                        <div class="d-flex gap-2">
                            <button id="btn-run-demo" class="btn btn-success w-50">▶ Ejecutar</button>
                            <button id="btn-cancel-demo" class="btn btn-danger w-50">⏹ Cancelar</button>
                        </div>
                    </div>
                </div>

                <!-- Joystick Derecho (Brazo) -->
                <div class="col-md-4 text-center">
                    <h5 class="text-white">CABINA / BRAZO</h5>
                    <div class="d-pad-ring mx-auto" id="joyRightWrap">
                        <div class="d-pad-hole"></div>
                        <div class="joy-stick" id="joyRight"></div>
                    </div>
                </div>
            </div>

            <!-- Indicador de Acción y Botón Detener -->
            <div class="bottom-plate text-center mt-4">
                <div class="mb-2">
                    <span id="action-status" class="badge bg-dark border border-secondary fs-6 font-monospace">Esperando acción...</span>
                </div>
                <button id="btn-13" class="btn btn-danger btn-lg w-75 fw-bold fs-4">⏹ DETENER TODO (13)</button>
            </div>
        </div>
    </main>

    <footer class="text-center text-white pb-3 credits position-relative fixed-bottom">
        <small class="fw-bold">Desarrollado por Silva Barriga Erick Brachiel · 2026</small>
    </footer>

    <script type="module" src="main.js"></script>
</body>
</html>
