<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Central de Control - Excavadora IoT</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>EXCAVADORA IOT</h1>
        <div class="status-indicator">
            <div class="led-group"><span class="led-label">WSS</span><span id="led-ws" class="dot sim" title="WebSocket"></span></div>
            <div class="led-group"><span class="led-label">API</span><span id="led-api" class="dot sim" title="API AWS"></span></div>
            <div class="led-group"><span class="led-label">RDS</span><span id="led-rds" class="dot sim" title="Amazon RDS"></span></div>
        </div>
    </header>

    <!-- Pestañas de Navegación -->
    <div class="tabs-container">
        <button id="tab-control" class="tab-btn active">🎮 Control y Demos</button>
        <button id="tab-historial" class="tab-btn inactive">📜 Historial en Vivo</button>
    </div>

    <main class="dashboard">
        
        <!-- VISTA 1: CONTROL Y DEMOS -->
        <div id="view-control" class="view-wrapper" style="display: flex;">
            <aside class="sidebar">
                <div class="panel" style="height: 100%;">
                    <h3>CATÁLOGO DE DEMOS</h3>
                    <div class="demo-builder">
                        <select id="demoSelect" class="demo-select">
                            <option value="">Cargando demos...</option>
                        </select>
                        <div class="demo-controls">
                            <button class="btn btn-play" id="btn-run-demo">▶ EJECUTAR</button>
                            <button class="btn btn-clear" id="btn-cancel-demo">⏹ CANCELAR</button>
                        </div>
                    </div>
                </div>
            </aside>

            <section class="main-control-area">
                <div class="remote-body">
                    <div class="top-plate">TRUCK CONTROL</div>
                    <div class="control-grid">
                        <div class="joy-wrap">
                            <div class="joy-label">ORUGAS</div>
                            <div class="d-pad-ring">
                                <div class="dir-hint up"><b>▲</b>Fwd</div>
                                <div class="dir-hint down">Rev<b>▼</b></div>
                                <div class="dir-hint left"><b>◀</b>Izq</div>
                                <div class="dir-hint right">Der<b>▶</b></div>
                                <div class="joy-stick" id="joyLeft"></div>
                            </div>
                        </div>

                        <div class="center-panel">
                            <button id="btn-7" class="btn-center">💡 LUCES</button>
                            <button id="btn-5" class="btn-center">🔊 SONIDO</button>
                            <button id="btn-8" class="btn-center">✨ AUX</button>
                        </div>

                        <div class="joy-wrap">
                            <div class="joy-label">CABINA / BRAZO</div>
                            <div class="d-pad-ring">
                                <div class="dir-hint up"><b>▲</b>Sube</div>
                                <div class="dir-hint down">Baja<b>▼</b></div>
                                <div class="dir-hint left"><b>◀</b>C.Izq</div>
                                <div class="dir-hint right">C.Der<b>▶</b></div>
                                <div class="joy-stick" id="joyRight"></div>
                            </div>
                        </div>
                    </div>
                    <div class="bottom-plate">
                        <button id="btn-stop">⏹ DETENER TODO (13)</button>
                    </div>
                </div>
            </section>
        </div>

        <!-- VISTA 2: HISTORIAL EN VIVO (Oculto por defecto) -->
        <div id="view-historial" class="view-wrapper" style="display: none; justify-content: center;">
            <div class="panel" style="width: 100%; max-width: 800px; height: 100%;">
                <h3>HISTORIAL DE OPERACIONES</h3>
                <ul id="historyList"></ul>
            </div>
        </div>

    </main>

    <footer class="bottom-footer">Desarrollado por Silva Barriga Erick Brachiel · 2026</footer>

    <script type="module" src="main.js"></script>
</body>
</html>
