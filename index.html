<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Excavadora IoT</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Barra superior oscura -->
    <header class="top-bar">
        <div class="logo">EXCAVADORA IOT</div>
        <!-- Los 3 LEDs solicitados -->
        <div class="leds-container">
            <div class="led-group">
                <span class="led-label">WSS</span>
                <div id="led-ws" class="led led-yellow"></div>
            </div>
            <div class="led-group">
                <span class="led-label">API</span>
                <div id="led-api" class="led led-yellow"></div>
            </div>
            <div class="led-group">
                <span class="led-label">RDS</span>
                <div id="led-rds" class="led led-yellow"></div>
            </div>
        </div>
    </header>

    <div class="main-layout">
        <!-- Columna Izquierda (Paneles oscuros) -->
        <aside class="left-panels">
            <!-- Historial -->
            <div class="dark-panel">
                <div class="panel-header">HISTORIAL EN VIVO</div>
                <div class="panel-content history-box" id="historial">
                    <!-- Aquí se llenarán los eventos -->
                </div>
            </div>

            <!-- Catálogo de Demos (Reemplaza al creador) -->
            <div class="dark-panel">
                <div class="panel-header">CATÁLOGO DE DEMOS</div>
                <div class="panel-content demo-box">
                    <select id="demoSelect" class="demo-select">
                        <option value="">Cargando demos...</option>
                    </select>
                    <div class="demo-buttons">
                        <button id="btn-run-demo" class="btn-demo btn-play">▶ EJECUTAR DEMO</button>
                        <button id="btn-cancel-demo" class="btn-demo btn-stop">⏹ CANCELAR</button>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Columna Central (El control principal naranja) -->
        <main class="center-remote">
            <div class="remote-body">
                <div class="remote-header">TRUCK CONTROL</div>
                
                <div class="remote-controls">
                    <!-- Joystick Izquierdo -->
                    <div class="control-column">
                        <div class="joystick-label">ORUGAS</div>
                        <div class="d-pad-ring" id="joyLeftWrap">
                            <div class="d-pad-hole"></div>
                            <div class="joy-stick" id="joyLeft"></div>
                            <!-- Flechas decorativas -->
                            <div class="arrow up">▲</div><div class="arrow down">▼</div>
                            <div class="arrow left">◀</div><div class="arrow right">▶</div>
                        </div>
                    </div>

                    <!-- Botones Centrales -->
                    <div class="control-column buttons-column">
                        <button id="btn-7" class="btn-action">💡 LUCES (7)</button>
                        <button id="btn-5" class="btn-action">🔊 SONIDO (5)</button>
                        <button id="btn-8" class="btn-action">⚙️ AUX (8)</button>
                    </div>

                    <!-- Joystick Derecho -->
                    <div class="control-column">
                        <div class="joystick-label">CABINA / BRAZO</div>
                        <div class="d-pad-ring" id="joyRightWrap">
                            <div class="d-pad-hole"></div>
                            <div class="joy-stick" id="joyRight"></div>
                            <!-- Flechas decorativas -->
                            <div class="arrow up">▲</div><div class="arrow down">▼</div>
                            <div class="arrow left">◀</div><div class="arrow right">▶</div>
                        </div>
                    </div>
                </div>

                <!-- Botón Detener -->
                <div class="remote-footer">
                    <button id="btn-13" class="btn-stop-all">⏹ DETENER TODO (13)</button>
                </div>
            </div>
        </main>
    </div>

    <!-- Footer con tu nombre -->
    <footer class="bottom-footer">
        Desarrollado por Silva Barriga Erick Brachiel · 2026
    </footer>

    <script type="module" src="main.js"></script>
</body>
</html>
